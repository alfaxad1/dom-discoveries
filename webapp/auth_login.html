<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <title>Dom Discoveries - Login</title>
    <link rel="icon" type="image/x-icon" href="assets/img/Web-Logo.png" />
    <!-- BEGIN GLOBAL MANDATORY STYLES -->
    <link href="https://fonts.googleapis.com/css?family=Quicksand:400,500,600,700&display=swap" rel="stylesheet">
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/plugins.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/authentication/form-1.css" rel="stylesheet" type="text/css" />
    <!-- END GLOBAL MANDATORY STYLES -->
    <link rel="stylesheet" type="text/css" href="assets/css/forms/theme-checkbox-radio.css">
    <link rel="stylesheet" type="text/css" href="assets/css/forms/switches.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        function loginUser() {
            window.location.href = 'http://localhost:3000/webapp/index.html';
        }

        function isTokenExpired() {
            const accessTokenExpiry = localStorage.getItem('access_token_expiry');
            if (!accessTokenExpiry) return true;

            const now = new Date().getTime();
            return now > accessTokenExpiry;
        }

        window.onload = function () {
            if (!isTokenExpired()) {
                loginUser();
                return;
            }

            const token = localStorage.getItem('access_token');
            if (token) {
                loginUser();
            }
        };
    </script>
</head>

<body class="form">


    <div class="form-container">
        <div class="form-form">
            <div class="form-form-wrap">
                <div class="form-container">
                    <div class="form-content">
                        <div class="about-home-2 pt-110" style="height: 30px;"></div>
                        <h1 class="">Log In To <a href="#"><span class="brand-name">Vaccation Masters</span></a></h1>
                        <h4>Admin Dashboard</h4>
                        <div class="about-home-2 pt-110" style="height: 20px;"></div>
                        <div id="message"></div>
                        <form class="text-left" id="loginForm">
                            <div class="form">

                                <div id="phone-field" class="field-wrapper input">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" class="feather feather-phone">
                                        <path
                                            d="M22 16.92V22a2 2 0 0 1-2.18 2c-10.29-1.09-18.73-9.51-19.82-19.82A2 2 0 0 1 2 0h5.09a2 2 0 0 1 2 1.72c.2 1.43.53 2.82 1 4.18a2 2 0 0 1-.45 2.11l-2.19 2.19a16 16 0 0 0 8 8l2.19-2.19a2 2 0 0 1 2.11-.45c1.36.48 2.75.8 4.18 1a2 2 0 0 1 1.72 2z">
                                        </path>
                                    </svg>
                                    <input id="phone_number" name="phone_number" type="text" value=""
                                        placeholder="Phone">
                                </div>


                                <div id="password-field" class="field-wrapper input mb-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" class="feather feather-lock">
                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                    </svg>
                                    <input id="password" name="password" type="password" class="form-control"
                                        placeholder="Password">
                                </div>
                                <div class="d-sm-flex justify-content-between">
                                    <div class="field-wrapper toggle-pass">
                                        <p class="d-inline-block">Show Password</p>
                                        <label class="switch s-primary">
                                            <input type="checkbox" id="toggle-password" class="d-none">
                                            <span class="slider round"></span>
                                        </label>
                                    </div>
                                    <div class="field-wrapper">
                                        <button id="submitButton" type="submit" class="btn"
                                            style="background-color: #7EC246; color: white;">Log In</button>

                                    </div>

                                </div>

                                <div class="field-wrapper text-center keep-logged-in">
                                    <div class="n-chk new-checkbox checkbox-outline-primary"> 
                                    </div>
                                </div>

                                <div class="field-wrapper">
                                </div>

                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-image">
            <div class="l-image">
            </div>
        </div>
    </div>


    <!-- BEGIN GLOBAL MANDATORY SCRIPTS -->
    <script src="assets/js/libs/jquery-3.1.1.min.js"></script>
    <script src="bootstrap/js/popper.min.js"></script>
    <script src="bootstrap/js/bootstrap.min.js"></script>

    <!-- END GLOBAL MANDATORY SCRIPTS -->
    <script src="assets/js/authentication/form-1.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            const phone_number = document.getElementById('phone_number').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            const submitButton = document.getElementById('submitButton');


            messageDiv.innerHTML = `<p style="color: #FFA500; font-weight:bolder;">Submitting, please wait...</p>`;
            submitButton.disabled = true;
            submitButton.innerText = "Please Wait...";
            try {
                const response = await fetch('http://localhost:3000/app/v1/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ phone_number: phone_number, password: password }),
                    credentials: 'include'
                });

                const result = await response.json();

                if (response.ok) {
                    messageDiv.innerHTML = `<p style="color: green; font-weight:bolder;">${result.message}</p>`;
                    
                    Toastify({
                        text: result.message,
                        duration: 3000,
                        close: true,
                        gravity: "top",
                        position: "right",
                        backgroundColor: "#4CAF50",
                    }).showToast();

                    setTimeout(() => {
                        if (result.redirect) {
                            localStorage.setItem('user', JSON.stringify(result.user));
                            localStorage.setItem('access_token', result.access_token);
                            localStorage.setItem('refresh_token', result.refresh_token); 
                            const accessTokenExpiry = new Date().getTime() + 3600 * 1000;  
                            localStorage.setItem('access_token_expiry', accessTokenExpiry);
                            window.location.href = result.redirect;
                        }
                    }, 2000);


                } else {
                    messageDiv.innerHTML = `<p style="color: red; font-weight:bolder;">${result.message}</p>`;
                    Toastify({
                        text: result.message,
                        duration: 3000,
                        close: true,
                        gravity: "top",
                        position: "right",
                        backgroundColor: "#F44336",
                    }).showToast();
                }

            } catch (error) {
                messageDiv.innerHTML = `<p style="color: red; font-weight:bolder;">${error.message}</p>`;
                console.log(`Error: ${error}`);
            } finally {
                submitButton.disabled = false;
                submitButton.innerText = "Log In";
            }
        });
    </script>
</body>

</html>
